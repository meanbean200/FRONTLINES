<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#182018" />
    <meta name="description" content="FRONTLINES large-scale battlefield simulation foundation" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 fill=%22%23d8b253%22/><path d=%22M18 12h32v9H29v8h17v9H29v14H18z%22 fill=%22%23131713%22/></svg>" />
    <title>FRONTLINES — Living Battlefield</title>
    <script data-file-launch>
      // Source files need Vite. Disk launches use the bundled, offline game.
      if (location.protocol === 'file:') location.replace(new URL('./FRONTLINES.html', location.href).href);
    </script>
    <style>
      #boot-status{position:fixed;inset:0;z-index:10000;display:grid;place-content:center;padding:32px;background:#111917;color:#eef1e9;font:16px/1.6 'Segoe UI',Arial,sans-serif}
      #boot-status>div{max-width:560px}#boot-status h1{font:600 36px 'Bahnschrift','Arial Narrow',sans-serif;letter-spacing:.12em}
      #boot-status p{color:#b2bdb8}#boot-status button{padding:10px 18px;background:#d4c093;color:#111917;border:0;font:inherit;cursor:pointer}
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="battlefield" aria-label="3D battlefield" tabindex="0"></canvas>
      <div id="ui-root"></div>
    </div>
    <section id="boot-status" aria-live="polite"><div>
      <h1>FRONTLINES</h1>
      <p id="boot-message">Preparing the battlefield…</p>
      <button id="boot-retry" hidden onclick="location.reload()">Try again</button>
      <noscript>Enable JavaScript in your browser to play FRONTLINES.</noscript>
    </div></section>
    <script data-boot-status>
      function reportBootFailure() {
        const message = document.getElementById('boot-message');
        if (!message) return;
        message.textContent = 'The game could not start. Try opening FRONTLINES.html in an updated Edge or Chrome with graphics acceleration enabled.';
        document.getElementById('boot-retry').hidden = false;
      }
      window.addEventListener('error', reportBootFailure);
      window.addEventListener('unhandledrejection', reportBootFailure);
    </script>
    <script type="module" data-source-entry>
      if (location.protocol !== 'file:') import('./src/main.ts');
    </script>
  </body>
</html>
